name: Secret scanning
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install checksum-pinned standalone scanner
        run: python3 .security/secrets.py install
      - name: Scan all available history without printing secret values
        run: python3 .security/secrets.py history
      - name: Verify commit and push blocking in disposable repositories
        run: python3 .security/test_secrets.py
